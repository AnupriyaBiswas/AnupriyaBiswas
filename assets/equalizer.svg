<svg width="100%" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="cosmicGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9400d3"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#4b0082"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="url(#cosmicGlow)" filter="url(#glow)">
    <!-- Auto-generate 20 bars -->
    <rect x="10" y="20" width="20" height="80">
      <animate attributeName="y" values="20;50;20" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="80;50;80" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="50" y="20" width="20" height="80">
      <animate attributeName="y" values="20;65;20" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="80;35;80" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="20" width="20" height="80">
      <animate attributeName="y" values="20;40;20" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="80;60;80" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="20" width="20" height="80">
      <animate attributeName="y" values="20;70;20" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="80;30;80" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="170" y="20" width="20" height="80">
      <animate attributeName="y" values="20;45;20" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="80;55;80" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="210" y="20" width="20" height="80">
      <animate attributeName="y" values="20;60;20" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="80;40;80" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="250" y="20" width="20" height="80">
      <animate attributeName="y" values="20;35;20" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="80;65;80" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="290" y="20" width="20" height="80">
      <animate attributeName="y" values="20;55;20" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="80;45;80" dur="1s" repeatCount="indefinite"/>
