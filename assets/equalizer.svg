<svg width="600" height="40" viewBox="0 0 600 40" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="10" height="20" fill="#1DB954">
    <animate attributeName="height" values="10;30;15;25;10" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="30" y="10" width="10" height="20" fill="#1DB954">
    <animate attributeName="height" values="20;10;30;15;20" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="50" y="10" width="10" height="20" fill="#1DB954">
    <animate attributeName="height" values="15;25;10;30;15" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="70" y="10" width="10" height="20" fill="#1DB954">
    <animate attributeName="height" values="25;15;20;10;25" dur="1.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="90" y="10" width="10" height="20" fill="#1DB954">
    <animate attributeName="height" values="10;30;20;15;10" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
